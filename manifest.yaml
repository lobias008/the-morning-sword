long_description: |
  The Morning Sword is a multi-asset momentum and pullback Playbook designed to capture orderly continuation after a broad trend has already aligned. It scans liquid Bitget contract markets across digital assets, precious metals, an oil-linked proxy, and equity-index exposure, then waits for price to return toward a higher-quality participation zone before issuing a signal. The thesis is that asymmetric trades are strongest when the larger trend, pullback behavior, liquidity, and momentum temperature all agree.

  The strategy enters long only when the higher timeframe trend stack supports upside continuation and the lower timeframe pullback shows renewed participation. It avoids chasing extended candles and instead looks for a controlled reset where price, volume behavior, and momentum sit in a balanced zone. Asset-specific gates make the decision stricter: gold is allowed only during the most liquid western sessions, BTC must pass a funding sanity check, and oil-linked exposure requires additional trend confirmation.

  Exits are built around turning early strength into protected optionality. The first profit event reduces exposure and immediately converts the remaining trade into a breakeven protected runner. The rest of the position follows a trend-trailing stop so larger directional moves can keep paying without letting a winner turn into an avoidable loss.

  Subscribers can tune the trading symbol list, margin budget, leverage, risk budget, stop distance behavior, session gates, and the current daily loss input used by the circuit breaker. Higher leverage and larger margin budgets increase both opportunity and drawdown. Stricter session and funding gates reduce signal count but can improve selectivity.

  The main risk is that multi-asset trend systems underperform during sideways markets, event gaps, thin liquidity, and fast reversals after macro news. Funding spikes, inventory events, and session transitions can also distort execution quality. This Playbook is a disciplined signal framework, not a guarantee of profit, and past performance or clean confluence does not remove market risk.
market_type: contract
trading_symbols:
  - BTCUSDT
  - XAUUSDT
  - AXTIUSDT
  - SP500USDT
tags:
  - getclaw
  - multi-asset
  - trend
  - confluence
  - bitget
schedule:
  cron: "0 */4 * * *"
  tz: "Asia/Shanghai"
decision_mode: deterministic
backtest_support: none
runtime_profile: deterministic
execution_mode: signal_only
follow_trade_supported: false
strategy_config:
  trading_symbols:
    - BTCUSDT
    - XAUUSDT
    - AXTIUSDT
    - SP500USDT
  symbol_roles:
    BTCUSDT: "BTC crypto perpetual"
    XAUUSDT: "Gold RWA perpetual"
    AXTIUSDT: "Oil-linked RWA proxy; requested OILUSDT was not found in Bitget public contracts"
    SP500USDT: "S&P 500 RWA perpetual; requested SPX500USDT was not found in Bitget public contracts"
  margin_budget: "100"
  leverage: 3
  risk_per_trade_pct: 1.0
  atr_stop_multiple: 1.5
  partial_take_profit_rr: 2.0
  partial_take_profit_pct: 50.0
  runner_target_rr: 4.0
  circuit_breaker_daily_loss_pct: -2.0
  reported_daily_pnl_pct: 0.0
  funding_rate_abs_limit_pct: 0.05
  london_session_utc:
    - 7
    - 10
  new_york_session_utc:
    - 13
    - 16
user_config_schema:
  trading_symbols:
    type: array
    item_type: string
    default:
      - BTCUSDT
      - XAUUSDT
      - AXTIUSDT
      - SP500USDT
    options:
      - BTCUSDT
      - XAUUSDT
      - AXTIUSDT
      - SP500USDT
    min_items: 1
    max_items: 4
    label: "Trading symbols"
  margin_budget:
    type: string
    default: "100"
    pattern: "^[0-9]+(\\.[0-9]+)?$"
    label: "Margin budget USDT"
  leverage:
    type: integer
    default: 3
    min: 1
    max: 20
    label: "Leverage"
  risk_per_trade_pct:
    type: number
    default: 1.0
    min: 0.1
    max: 1.0
    label: "Risk per trade percent"
  reported_daily_pnl_pct:
    type: number
    default: 0.0
    min: -100.0
    max: 100.0
    label: "Reported daily PnL percent"
